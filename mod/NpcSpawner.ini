; NPC Spawner - read again on every spawn (Ctrl+F6), no restart needed.
; Written by "Save these settings" in the NPC Spawner tab.
[Spawn]
; NpcParam id. 0 = a copy of the nearest living enemy within 30 m.
NpcParamId = 0
; Model (cXXXX). 0 = (NpcParamId / 10000) % 10000
ChrId = 0
; NpcThinkParam (AI). 0 = automatic: the copied character's, or the one the game's maps give it
ThinkId = 0
CharaInitId = -1
; 1-20
Count = 1
; most spawned alive at once (1-76)
MaxSpawned = 30
; metres (also the radius for Random)
Distance = 5
; Front, Player, Target (lock-on), Saved (Ctrl+F5), Random
Placement = Front
; Line, Circle, Grid
Formation = Line
FacePlayer = 1

[Behaviour]
; Active, Paused, Still
AI = Active
; Hostile (as spawned), Ally (team 47), Neutral (NeutralTeam, does not fight you) or a raw teamType number
Team = Hostile
; health at spawn, % of max
HpPercent = 100
; 0 = the NpcParam's maximum
MaxHp = 0
; refilled when it drops to 10 %
InfiniteHp = 0
Invulnerable = 0
; changing the side spawns them again in place, so they forget you as a target
SideChangeRespawn = 1
; team of Side = Neutral: 28 friendly NPCs (can be hit), 0 Roundtable NPCs (cannot)
NeutralTeam = 28
; allies left farther than this (metres) for 4 s are moved behind you (0 = off)
FollowDistance = 20

[Remove]
; removed characters are destroyed 1 s later, freeing their slot (0 = only hidden)
DestroyRemoved = 1

[Limits]
; Experimental. Raise the game's active-character limit to at least this
; (0 = the game's own, about 60). Higher = more enemies at once, more load.
MaxActive = 0
; Per-frame character update budgets near / far (0 = the game's, 10 / 15).
UpdateNear = 0
UpdateFar = 0

[Menu]
; 0 = an entry in Mod Settings (recommended). 1 = own tab in the System
; screen: experimental, it can take the whole menu down; restart needed.
OwnTab = 0
; 1 = the name search and the dialog's lists show every NpcParam row;
; 0 = one row per character, without unnamed and non-combat rows.
SearchAll = 0

[Research]
; 1 = Ctrl+Shift+F7 writes memory dumps to dumps\, and the full catalogue of
; NpcParam rows is written next to the DLL (NpcSpawner-catalog.tsv).
Research = 0

[Hotkeys]
; Changes apply while the game runs (the INI is checked every second).
; A key with Ctrl, Shift and / or Alt: Ctrl+F6, Shift+K, Alt+Num5, F9, Mouse4.
; Keys: A-Z, 0-9, F1-F24, Num0-Num9, NumAdd, NumSubtract, NumMultiply, NumDivide,
; NumDecimal, Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right,
; Space, Enter, Tab, Backspace, Pause, Mouse3 (middle), Mouse4, Mouse5.
; None = no hotkey. The modifiers must match exactly. Avoid Alt+F4.
; The talk menu can also assign them: Spawn options > Hotkeys.
; 0 = every hotkey off.
Hotkeys = 1
; Save the spawn point
SavePoint = Ctrl+F5
; Spawn
Spawn = Ctrl+F6
; Spawn the last one again
SpawnAgain = Ctrl+Shift+F6
; AI of all (active, paused, still)
CycleAi = Ctrl+F7
; Side of all (as spawned, yours)
ToggleTeam = Ctrl+F8
; Reset all
ResetAll = Ctrl+F9
; Remove the last one
RemoveLast = Ctrl+F10
; Remove all
RemoveAll = Ctrl+Shift+F10
; Talk menu
TalkMenu = F11
; Memory dump (Research = 1)
Dump = Ctrl+Shift+F7
